const ROTATE_KEY = 'feed.rotation';

// Which product opens in the wide featured slot. Advanced once per page load
// and then left alone: a strip the user is looking at never moves under them,
// and the next panel - another tab, tomorrow's editor start - begins one
// product further along. A counter rather than a random pick, so every product
// gets its turn instead of some never coming up.
function startAt(count) {
  try {
    const stored = localStorage.getItem(ROTATE_KEY);
    const previous = stored === null ? -1 : Number(stored);
    const step = (Number.isInteger(previous) && previous >= 0 ? previous + 1 : 0) % count;
    localStorage.setItem(ROTATE_KEY, String(step));
    return step;
  } catch (error) {
    // No storage available - a random start still spreads the featured slot
    // around, just less evenly.
    return Math.floor(Math.random() * count);
  }
}

// A sale carries the window Fab published for it, so the page knows when the
// discount stops being true. That is what lets a sale END, and a sale Fab
// scheduled in advance START, with nothing rebuilt.
function saleNow(product, now) {
  const sale = product.Sale;
  if (!sale) return null;
  if (sale.From && now < Date.parse(sale.From)) return null;
  if (sale.Until && now >= Date.parse(sale.Until)) return null;
  return sale;
}

// Fixed for the life of this page. Nothing below recomputes it.
const STEP = startAt(PRODUCTS.length);

function ordered(now) {
  const rotated = PRODUCTS.slice(STEP).concat(PRODUCTS.slice(0, STEP));
  // Whatever is on sale takes the front for as long as the sale runs; the
  // rotation stays as it was underneath and resurfaces when it ends.
  return rotated.filter(p => saleNow(p, now))
    .concat(rotated.filter(p => !saleNow(p, now)));
}

function priceHtml(product, now) {
  const price = Number(product.Price);
  if (price === 0) return '<div class="price">Free</div>';
  const sale = saleNow(product, now);
  if (!sale) return '<div class="price">$' + price.toFixed(2) + '</div>';
  const reduced = Math.floor(price * (1 - sale.Percent / 100) * 100) / 100;
  return '<div class="sale"><span class="off">' + sale.Percent + '%OFF</span>'
       + '<span class="now"><span class="was">$' + price.toFixed(2) + '</span>$'
       + reduced.toFixed(2) + '</span></div>';
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const strip = document.getElementById('strip');
let drawn = '';

function draw() {
  const now = Date.now();
  const items = ordered(now);
  // Redraw only when the result actually differs. Rewriting the strip on a
  // timer that changes nothing would re-resolve every image and flicker a
  // panel somebody is looking at.
  const key = items.map(p => {
    const sale = saleNow(p, now);
    return p.Name + (sale ? ':' + sale.Percent : '');
  }).join('|');
  if (key === drawn) return;
  drawn = key;

  strip.innerHTML = items.map((product, index) => {
    const image = index === 0 ? product.FeaturedUrl : product.ImageUrl;
    return '<a class="card" href="' + escapeHtml(product.ProductUrl) + '">'
         + '<img src="' + escapeHtml(image) + '" alt="" loading="lazy">'
         + '<div class="meta"><div class="name">' + escapeHtml(product.Name) + '</div>'
         + priceHtml(product, now) + '</div></a>';
  }).join('');
}

draw();
// The order never changes after this; the only thing this timer can alter is a
// sale that has run out, and the key check above means it repaints nothing
// until that actually happens. Without it an editor left open overnight would
// keep advertising a discount that expired at 21:00 - a price LOWER than the
// one the customer would be charged, which is the wrong way round to be wrong.
setInterval(draw, 60000);
